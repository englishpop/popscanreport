                </div>

              <div className="flex-1 flex flex-col justify-center">

                  <div className="text-center mb-6">
                    <span className="inline-block px-3 py-1 bg-white rounded-full text-xs font-bold text-gray-500 shadow-sm mb-3 border border-indigo-100">실시간 학습 기질 판독 결과</span>
                    <h3 className="text-2xl font-black text-indigo-700 leading-tight">{t.icon} {t.name}</h3>
                    <p className="text-sm font-bold text-indigo-400 tracking-wide mb-4 mt-1">{t.en}</p>
                    <p className="text-gray-700 text-sm leading-relaxed text-left bg-white p-4 rounded-lg shadow-sm break-keep">{content.description}</p>

                    <div className="mt-3 bg-white p-3 rounded-lg shadow-sm text-left text-[12px] text-gray-600 space-y-1">
                      <p className="text-[11px] font-bold text-gray-400 tracking-wide">세 축 판정</p>
                      <p>행동 <strong className={isB ? 'text-blue-600' : 'text-gray-500'}>{isB ? 'O' : 'X'}</strong> · {isB ? '틀린 문제가 나와도 자리를 지키고, 다시 한 번 풀어보겠다고 하는 모습이 자리 잡았습니다' : '틀린 문제 앞에서 자리를 지키고 다시 붙는 모습은 지금 만들어지는 중입니다'}</p>
                      <p>인지 <strong className={isC ? 'text-emerald-600' : 'text-gray-500'}>{isC ? 'O' : 'X'}</strong> · {isC ? '문제를 읽고 제 시간 안에 스스로 답을 정해 확인 버튼을 누릅니다' : '답을 정하기까지 시간이 더 걸리는 모습입니다 — 느린 게 아니라 자기 템포를 찾는 중입니다'}</p>
                      <p>동기 <strong className={isM ? 'text-red-500' : 'text-gray-500'}>{isM ? 'O' : 'X'}</strong> · {isM ? '확인 버튼을 누르기 전 한 번 더 살펴 답을 바로잡고, 힌트 없이 제 힘으로 밀고 나갑니다' : '확인 전에 되돌아보고 혼자 힘으로 밀고 가는 모습은 지금 만들어지는 중입니다'}</p>
                    </div>
                  </div>

                  <div className="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
                    <h4 className="text-sm font-bold text-gray-800 mb-3 flex items-center">
                      <svg className="w-4 h-4 mr-2 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                      발견된 핵심 행동 패턴 (Trigger Events)
                    </h4>
                    <ul className="space-y-2">
                      {content.behaviors.map((x, i) => (
                        <li key={i} className="flex items-start text-sm text-gray-600 leading-relaxed"><span className="text-indigo-400 mr-2">▪</span><span className="flex-1 break-keep">{x}</span></li>
                      ))}
                    </ul>
                  </div>

                  <div className="bg-gradient-to-br from-violet-600 to-indigo-600 rounded-xl p-5 shadow-md mt-4">
                    <h4 className="text-sm font-bold text-white mb-3 flex items-center">
                      <svg className="w-4 h-4 mr-2 text-violet-200" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                      잉글리시팝 코칭 로드맵 (Coaching Roadmap)
                    </h4>
                    <ul className="space-y-3">
                      {content.roadmap.map((x, i) => (
                        <li key={i} className="flex items-start text-[13px] text-violet-50 leading-relaxed">
                          <span className="flex-shrink-0 w-5 h-5 rounded-full bg-white/20 text-white text-[10px] font-bold flex items-center justify-center mr-2.5 mt-0.5">{i + 1}</span>
                          <span className="flex-1 break-keep">{x}</span>
                        </li>
                      ))}
                    </ul>
                  </div>
                </div>
              </div>
            </div>
            )}

                </div>
                <div className="flex-1 space-y-4">
                  <div className="p-4 rounded-xl bg-indigo-50/60 border border-indigo-100">
                    <p className="text-xs font-bold text-indigo-600 mb-1">① 레이더 읽기 — 아이의 현재 위치부터</p>
                    <p className="text-[12.5px] text-gray-700 leading-relaxed mb-2">"먼저 아이의 현재 위치부터 볼게요. 이 레이더 그래프는 지금까지 검사한 또래 친구들의 평균(회색 선)과 비교한 아이의 위치예요."</p>
                    <p className="text-[11px] text-gray-400 mb-2">축마다 아래 두 문장 중 하나를 고릅니다. 파란 선이 회색 선에 닿아 있거나 넘으면 왼쪽, 못 미치면 오른쪽. 세 축 모두 읽습니다.</p>
                    <div className="text-[12.5px] text-gray-700 leading-relaxed space-y-2.5">
                      <div>
                        <p className="font-bold text-blue-500 mb-0.5">행동 조절 — '엉덩이 힘과 끈기'</p>
                        <p>또래선 이상 · "책상 앞에서 학습을 붙들고 끌고 가는 힘이 또래 평균보다 높은 위치예요. 모든 학습의 토대가 되는 영역이라 가장 든든한 신호입니다."</p>
                        <p>못 미침 · "공부 체력이 아직 차오르는 단계예요. 능력이 아니라 시간이 쌓아 주는 영역이라, 습관이 잡히는 순간 가장 확실하게 올라옵니다."</p>
                      </div>
                      <div>
                        <p className="font-bold text-emerald-600 mb-0.5">인지 조절 — '뇌의 순발력'</p>
                        <p>또래선 이상 · "생각을 정리해 답을 내는 템포가 또래 평균보다 민첩해요. 같은 시간에 더 많이 배우게 해 주는, 학습 속도를 좌우하는 영역입니다."</p>
                        <p>못 미침 · "느린 게 아니라 자기 템포를 찾아가는 중이에요. 익숙해질수록 빨라지는 영역이라 조급해하실 필요가 없습니다."</p>
                      </div>
                      <div>
                        <p className="font-bold text-red-500 mb-0.5">동기 조절 — '스스로 하려는 마음'</p>
                        <p>또래선 이상 · "시키지 않아도 제 힘으로 해내려는 마음이 또래 평균보다 강해요. 학년이 올라갈수록 진짜 격차를 만드는 영역입니다."</p>
                        <p>못 미침 · "의지의 문제가 아니라 경험의 문제예요. 스스로 해서 되는 경험이 쌓이면 자연스럽게 차오르는 영역입니다."</p>
                      </div>
                    </div>
                  </div>
                  <div className="p-4 rounded-xl bg-amber-50/70 border border-amber-200">
                    <p className="text-xs font-bold text-amber-600 mb-1">② 유형으로 넘어가는 쿠션 멘트</p>
                    <p className="text-[12.5px] text-gray-700 leading-relaxed">"위치는 이렇고요, 이제 학습 기질 유형을 볼게요. 유형은 또래 비교가 아니라 <strong>습관이 자리 잡았는가</strong>라는 기준으로 본 거라, 방금 그래프와는 조금 다르게 보일 수 있어요. 왜 그런지는 세부 지표에서 함께 확인드릴게요."</p>
                  </div>
                </div>
              </div>

            )}

            {tab === 'radar' && (
            <div className="flex flex-col gap-6">
              <div>
                <h2 className="text-2xl font-bold text-gray-800 mb-2">학습 조절 능력 분포</h2>
                <p className="text-sm text-gray-500">상담은 넓게 시작해 깊게 들어갑니다. 레이더로 또래 속 위치를 먼저 읽고, 유형으로 방향을 잡고, 세부 지표로 근거를 보여주세요.</p>
              </div>
              
            </div>
            )}
