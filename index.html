            <div className="flex flex-col md:flex-row gap-8">

              {/* ─── 왼쪽: 매트릭스 + 지표 정의 ─── */}
              <div className="flex-1 space-y-6">
                <div>
                  <h2 className="text-2xl font-bold text-gray-800 mb-2">학습기질 매트릭스</h2>
                  <p className="text-sm text-gray-500">해당되는 유형을 선택해 판독해 보세요. 축별 판정 지표는 아래에서 확인할 수 있습니다.</p>
                </div>

                <div className="grid grid-cols-2 gap-2.5">
                  {ALL_TYPES.map((type) => {
                    const isActive = type.id === typeId;
                    return (
                      <button
                        key={'mx' + type.id}
                        onClick={() => setTypeId(type.id)}
                        className={`text-left p-3 rounded-xl border-2 transition-all duration-200 ${isActive ? 'bg-indigo-600 border-indigo-600 shadow-lg scale-[1.02]' : 'bg-white border-gray-200 hover:border-indigo-300 hover:shadow-sm'}`}
                      >
                        <div className="flex items-center gap-1.5 mb-1">
                          <span className="text-lg">{type.icon}</span>
                          <span className={`text-sm font-bold ${isActive ? 'text-white' : 'text-gray-800'}`}>{type.name}</span>
                        </div>
                        <p className={`text-[10px] leading-snug mb-1.5 break-keep ${isActive ? 'text-indigo-100' : 'text-gray-400'}`}>{type.desc}</p>
                        <div className={`flex gap-1 text-[9px] font-bold ${isActive ? 'text-indigo-100' : 'text-gray-400'}`}>
                          <Tag on={type.b} label="행동" active={isActive} onCls="bg-blue-50 text-blue-500" />
                          <Tag on={type.c} label="인지" active={isActive} onCls="bg-emerald-50 text-emerald-600" />
                          <Tag on={type.m} label="동기" active={isActive} onCls="bg-red-50 text-red-500" />
                        </div>
                      </button>
                    );
                  })}
                </div>

                <div className="border-t border-gray-100 pt-4 space-y-3">
                  <p className="text-xs font-bold text-gray-400 tracking-wide">축별 판정 지표</p>
                  <AxisBlock label="행동 조절 (B)" ok={isB} inds={INDICATORS.behavior} onColor="bg-blue-50/60 border-blue-200" strong="text-blue-500" />
                  <AxisBlock label="인지 조절 (C)" ok={isC} inds={INDICATORS.cognition} onColor="bg-emerald-50/60 border-emerald-200" strong="text-emerald-600" />
                  <AxisBlock label="동기 조절 (M)" ok={isM} inds={INDICATORS.motivation} onColor="bg-red-50/60 border-red-200" strong="text-red-500" />

                    <span className="inline-block px-3 py-1 bg-white rounded-full text-xs font-bold text-gray-500 shadow-sm mb-3 border border-indigo-100">실시간 학습 기질 판독 결과</span>
                    <h3 className="text-2xl font-black text-indigo-700 leading-tight">{t.icon} {t.name}</h3>
                    <p className="text-sm font-bold text-indigo-400 tracking-wide mb-4 mt-1">{t.en}</p>
                    <p className="text-gray-700 text-sm leading-relaxed text-left bg-white p-4 rounded-lg shadow-sm break-keep">{content.description}</p>

                    <div className="mt-3 bg-white p-3 rounded-lg shadow-sm text-left text-[12px] text-gray-600 space-y-1">
                      <p className="text-[11px] font-bold text-gray-400 tracking-wide">판정 근거</p>
                      <p>행동 <strong className={isB ? 'text-blue-600' : 'text-gray-500'}>{isB ? 'O' : 'X'}</strong> · {isB ? '몰입유지력·공부끈기·재시도근성 모두 통과' : '몰입유지력·공부끈기·재시도근성 중 미달 지표 있음 (대개 재시도근성)'}</p>
                      <p>인지 <strong className={isC ? 'text-emerald-600' : 'text-gray-500'}>{isC ? 'O' : 'X'}</strong> · {isC ? '생각속도 통과' : '생각속도 미달'} <span className="text-gray-400">(공부리듬은 성장 리포트에서 측정)</span></p>
                      <p>동기 <strong className={isM ? 'text-red-500' : 'text-gray-500'}>{isM ? 'O' : 'X'}</strong> · {isM ? '수정이력·학습독립성 모두 통과' : '수정이력·학습독립성 중 미달 지표 있음 (대개 수정이력)'}</p>
                      {(!isB || !isC || !isM) && <p className="text-[11px] text-gray-400 pt-1">코칭 로드맵은 실제 미달 지표를 출발점으로 조정해 안내하세요.</p>}
                    </div>
                  </div>

                  <div className="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
                    <h4 className="text-sm font-bold text-gray-800 mb-3 flex items-center">
                      <svg className="w-4 h-4 mr-2 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                      발견된 핵심 행동 패턴 (Trigger Events)
                    </h4>
                    <ul className="space-y-2">
                      {content.behaviors.map((x, i) => (
                        <li key={i} className="flex items-start text-sm text-gray-600 leading-relaxed"><span className="text-indigo-400 mr-2">▪</span><span className="flex-1 break-keep">{x}</span></li>
                      ))}
                    </ul>
                  </div>

                  <div className="bg-gradient-to-br from-violet-600 to-indigo-600 rounded-xl p-5 shadow-md mt-4">
                    <h4 className="text-sm font-bold text-white mb-3 flex items-center">
                      <svg className="w-4 h-4 mr-2 text-violet-200" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                      잉글리시팝 코칭 로드맵 (Coaching Roadmap)
                    </h4>
                    <ul className="space-y-3">
                      {content.roadmap.map((x, i) => (
                        <li key={i} className="flex items-start text-[13px] text-violet-50 leading-relaxed">
                          <span className="flex-shrink-0 w-5 h-5 rounded-full bg-white/20 text-white text-[10px] font-bold flex items-center justify-center mr-2.5 mt-0.5">{i + 1}</span>
                          <span className="flex-1 break-keep">{x}</span>
                        </li>
                      ))}
                    </ul>
                  </div>
                </div>
              </div>
            </div>

          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<TemperamentSimulator />);
  </script>
</body>
</html>
