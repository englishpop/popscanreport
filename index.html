<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>학습조절능력 기질 시뮬레이터</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(-1rem); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in { animation: fadeInSlide 0.5s ease-out; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const TemperamentSimulator = () => {
      const [mScore, setMScore] = useState(75);
      const [bScore, setBScore] = useState(75);
      const [cScore, setCScore] = useState(75);
      const [dominantType, setDominantType] = useState('');
      const [typeDescription, setTypeDescription] = useState('');
      const [behaviorList, setBehaviorList] = useState([]);
      const [roadmapList, setRoadmapList] = useState([]);

      const allTypes = [
        { id: 1, m: true, b: true, c: true, icon: '👑', name: '올라운드 밸런스형', desc: '집중력, 두뇌 회전, 자립심을 모두 갖춘 완성형 우등생', color: 'bg-purple-50 border-purple-200 text-purple-700' },
        { id: 2, m: true, b: true, c: false, icon: '🎯', name: '성실한 자립형', desc: '진득한 끈기와 스스로 해결하려는 의지를 겸비', color: 'bg-blue-50 border-blue-200 text-blue-700' },
        { id: 3, m: true, b: false, c: true, icon: '⚡', name: '영리한 해결사형', desc: '빠른 두뇌 회전과 자립심을 갖춘 스마트 해결사', color: 'bg-teal-50 border-teal-200 text-teal-700' },
        { id: 4, m: true, b: false, c: false, icon: '🔥', name: '당찬 자립형', desc: '스스로 고치고 혼자 해내려는 의지가 강한 아이', color: 'bg-red-50 border-red-200 text-red-700' },
        { id: 5, m: false, b: true, c: true, icon: '🦉', name: '차분한 탐구형', desc: '흔들림 없는 집중력과 안정적인 사고 흐름의 소유자', color: 'bg-indigo-50 border-indigo-200 text-indigo-700' },
        { id: 6, m: false, b: true, c: false, icon: '🌳', name: '우직한 성실형', desc: '끝까지 포기하지 않는 진득한 엉덩이 힘의 소유자', color: 'bg-sky-50 border-sky-200 text-sky-700' },
        { id: 7, m: false, b: false, c: true, icon: '💡', name: '명민한 두뇌형', desc: '또래보다 빠르고 안정적인 두뇌 회전이 돋보임', color: 'bg-emerald-50 border-emerald-200 text-emerald-700' },
        { id: 8, m: false, b: false, c: false, icon: '🌱', name: '무한 잠재력형', desc: '어떤 강점도 흡수할 수 있는 열려있는 도화지 기질', color: 'bg-stone-50 border-stone-200 text-stone-700' }
      ];

      useEffect(() => {
        const isM = mScore >= 50;
        const isB = bScore >= 50;
        const isC = cScore >= 50;

        if (isM && isB && isC) {
          setDominantType('👑 올라운드 밸런스형 (All-Round Balancer)');
          setTypeDescription('집중력, 두뇌 회전, 자립심을 모두 갖춘 이상적인 우등생 기질입니다. 어떤 난이도의 과제가 주어져도 스스로 멘탈을 관리하며 안정적으로 해결해 냅니다.');
          setBehaviorList(['딴짓 없이 끝까지 완주하는 몰입유지력과 공부끈기', '또래보다 빠른 생각속도와 일정한 공부리듬', '스스로 실수를 고치고 힌트 없이 해결하는 자립심']);
          setRoadmapList(['상위 레벨 콘텐츠 조기 오픈으로 도전 욕구를 지속 자극', '또래 발화 리더 역할 부여 → 성취를 표현의 기회로 확장', '월별 성장리포트로 최상위 페이스 유지 여부만 모니터링']);
        } else if (isM && isB && !isC) {
          setDominantType('🎯 성실한 자립형 (Sincere Independent)');
          setTypeDescription('진득하게 앉아 끝까지 해내는 끈기와, 스스로 실수를 고치고 혼자 해결하려는 의지를 겸비했습니다. 처리 속도는 아직 발전 중이지만, 성실함과 자립심이 탄탄해 꾸준히 성취를 쌓아가는 유형입니다.');
          setBehaviorList(['오답에 좌절하지 않고 즉각 재도전하는 재시도근성', '딴짓 없이 끝까지 완주하는 강한 공부끈기', '스스로 실수를 발견하고 고치는 수정이력']);
          setRoadmapList(['타이머 게임형 퀴즈로 처리속도를 놀이처럼 끌어올리기', '음원 따라 말하기(섀도잉) 반복으로 반응속도 자연 향상', '끈기가 무기이므로 분량보다 속도 중심 미션으로 설계']);
        } else if (isM && !isB && isC) {
          setDominantType('⚡ 영리한 해결사형 (Clever Solver)');
          setTypeDescription('빠른 두뇌 회전과 스스로 해결하려는 자립심이 돋보입니다. 다만 흥미가 떨어지면 집중이 흐트러질 수 있어, 몰입을 유지시켜주는 환경이 뒷받침되면 폭발적인 성과를 냅니다.');
          setBehaviorList(['또래보다 빠른 생각속도로 문제에 즉각 반응', '힌트 없이 혼자 해결하는 높은 학습독립성', '일정한 공부리듬으로 페이스를 안정적으로 유지']);
          setRoadmapList(['짧은 단위 미션 → 즉시 보상 루프로 몰입 시간을 점진 확장', '흥미 주제(스토리·게임형 콘텐츠) 우선 배치로 이탈 방지', '학습 시간을 고정 루틴화하여 완주 습관 만들기']);
        } else if (isM && !isB && !isC) {
          setDominantType('🔥 당찬 자립형 (Bold Independent)');
          setTypeDescription('스스로 실수를 고치고 힌트 없이 혼자 해내려는 의지가 매우 강한 아이입니다. 집중 지속과 처리 속도는 아직 자라는 중이지만, 이 강한 자립심이야말로 학습 성장의 가장 단단한 엔진입니다.');
          setBehaviorList(['스스로 실수를 발견하고 즉시 교정하는 수정이력', '힌트 없이 부딪히며 해결하려는 학습독립성', '자기 확신이 강해 주도적으로 문제에 접근함']);
          setRoadmapList(['혼자 해내려는 의지를 칭찬 포인트로 → 자신감 기반 확장', '동일한 문항 구조를 반복 연습하여 처리 속도의 기초 체력을 탄탄하게', '5분 몰입 → 10분 몰입 단계별 착석 목표로 집중력 훈련']);
        } else if (!isM && isB && isC) {
          setDominantType('🦉 차분한 탐구형 (Calm Explorer)');
          setTypeDescription('흔들림 없는 집중력과 빠르고 안정적인 사고 흐름을 함께 갖췄습니다. 아직 힌트에 기대는 경향이 있지만, 혼자 해결하는 성공 경험이 쌓이면 최상위권 잠재력이 터지는 유형입니다.');
          setBehaviorList(['딴짓 없이 화면에 집중하는 높은 몰입유지력', '일정한 공부리듬으로 페이스를 흔들림 없이 유지', '포기 않고 끝까지 완주하는 공부끈기']);
          setRoadmapList(['힌트 없이 성공하는 경험을 의도적으로 설계 (쉬운 문항부터)', '"혼자 해냈네!" 즉각 피드백으로 학습독립성 강화', '자기교정 습관을 위해 확인 전 재점검 루틴 지도']);
        } else if (!isM && isB && !isC) {
          setDominantType('🌳 우직한 성실형 (Steadfast Worker)');
          setTypeDescription('속도보다 끈기로 승부하는 진득한 노력파입니다. 딴짓 없이 끝까지 완주하는 엉덩이 힘이 최대 강점이며, 처리 속도와 자립심은 반복 경험을 통해 자연스럽게 따라오는 유형입니다.');
          setBehaviorList(['딴짓 없이 학습에만 집중하는 몰입유지력', '흔들림 없이 끝까지 완주하는 공부끈기', '실패 앞에서도 다시 도전하는 재시도근성']);
          setRoadmapList(['속도 압박 없는 반복 학습으로 성공 경험 누적이 최우선', '음원·이미지 결합 콘텐츠로 처리속도를 감각적으로 향상', '작은 성취마다 보상하여 끈기를 자존감으로 연결']);
        } else if (!isM && !isB && isC) {
          setDominantType('💡 명민한 두뇌형 (Bright Thinker)');
          setTypeDescription('또래보다 빠른 생각속도와 일정한 사고 페이스가 돋보이는 두뇌파입니다. 다만 진득하게 앉아있는 힘과 혼자 해결하려는 의지가 함께 자라면 잠재력이 완성되는 유형입니다.');
          setBehaviorList(['또래보다 빠른 생각속도로 문제를 처리', '일정한 공부리듬으로 페이스를 안정적으로 유지', '흥미 있는 과제에서 순간 집중력이 폭발함']);
          setRoadmapList(['빠른 두뇌에 맞는 속도감 있는 학습 제시', '완주 시에만 열리는 보상 구조로 끝까지 푸는 습관 형성', '힌트 사용 전 "한 번 더 생각" 규칙으로 자립심 훈련']);
        } else {
          setDominantType('🌱 무한 잠재력형 (Budding Potential)');
          setTypeDescription('아직 특정한 기질이 고착화되지 않은 유연하고 열린 상태입니다. 앞으로 어떤 코칭을 받고 어떤 환경에 놓이느냐에 따라 다양한 강점을 흡수하고 폭발적으로 성장할 수 있는 도화지 같은 기질입니다.');
          setBehaviorList(['특정 패턴에 얽매이지 않는 자유로운 반응', '에너지를 비축하며 상황을 관망함', '직관과 경험을 바탕으로 한 유연한 탐색']);
          setRoadmapList(['부담 없는 최저 난이도부터 시작해 성공 경험 우선 축적', '아이가 반응하는 콘텐츠 유형(노래·게임·스토리) 관찰 후 집중 배치', '1:1 관심 코칭으로 학습 정서부터 안정화 → 기질 발현 유도']);
        }
      }, [mScore, bScore, cScore]);

      return (
        <div className="flex flex-col items-center py-10 px-4 bg-gray-50 min-h-screen font-sans">
          <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-5xl flex flex-col gap-8">

            <div className="flex flex-col md:flex-row gap-8">
              <div className="flex-1 space-y-6">
                <div>
                  <h2 className="text-2xl font-bold text-gray-800 mb-2">학습기질 매트릭스</h2>
                  <p className="text-sm text-gray-500">해당되는 유형을 직접 선택하거나, 아래 행동, 인지, 동기 조절의 축별 점수를 조합해 판독해 보세요.</p>
                </div>

                {/* 8유형 매트릭스 */}
                <div className="grid grid-cols-2 gap-2.5">
                  {allTypes.map((type) => {
                    const isActive = (mScore >= 50) === type.m && (bScore >= 50) === type.b && (cScore >= 50) === type.c;
                    return (
                      <button
                        key={'mx' + type.id}
                        onClick={() => { setMScore(type.m ? 75 : 25); setBScore(type.b ? 75 : 25); setCScore(type.c ? 75 : 25); }}
                        className={`text-left p-3 rounded-xl border-2 transition-all duration-200 ${isActive ? 'bg-indigo-600 border-indigo-600 shadow-lg scale-[1.02]' : 'bg-white border-gray-200 hover:border-indigo-300 hover:shadow-sm'}`}
                      >
                        <div className="flex items-center gap-1.5 mb-1">
                          <span className="text-lg">{type.icon}</span>
                          <span className={`text-sm font-bold ${isActive ? 'text-white' : 'text-gray-800'}`}>{type.name}</span>
                        </div>
                        <div className={`flex gap-1 text-[9px] font-bold ${isActive ? 'text-indigo-100' : 'text-gray-400'}`}>
                          <span className={`px-1 rounded ${type.m ? (isActive ? 'bg-white/20' : 'bg-red-50 text-red-500') : 'opacity-40'}`}>동기{type.m ? ' O' : ' X'}</span>
                          <span className={`px-1 rounded ${type.b ? (isActive ? 'bg-white/20' : 'bg-blue-50 text-blue-500') : 'opacity-40'}`}>행동{type.b ? ' O' : ' X'}</span>
                          <span className={`px-1 rounded ${type.c ? (isActive ? 'bg-white/20' : 'bg-green-50 text-green-600') : 'opacity-40'}`}>인지{type.c ? ' O' : ' X'}</span>
                        </div>
                      </button>
                    );
                  })}
                </div>

                {/* 축별 점수 선택 + 정의 */}
                <div className="border-t border-gray-100 pt-4 space-y-3">
                  <p className="text-xs font-bold text-gray-400 tracking-wide">축별 점수 직접 설정 (50점 기준)</p>

                  <div className={`p-3 rounded-xl border transition-colors ${bScore >= 50 ? 'bg-blue-50/60 border-blue-200' : 'bg-gray-50 border-gray-200'}`}>
                    <div className="flex items-center justify-between gap-2">
                      <label className="text-sm text-gray-700 font-bold shrink-0">행동 조절 (B)</label>
                      <div className="flex gap-1.5">
                        <button onClick={() => setBScore(75)} className={`px-3 py-1.5 rounded-lg text-xs font-bold border-2 transition-all ${bScore >= 50 ? 'bg-blue-500 border-blue-500 text-white' : 'bg-white border-gray-200 text-gray-400 hover:border-blue-300'}`}>50점 이상</button>
                        <button onClick={() => setBScore(25)} className={`px-3 py-1.5 rounded-lg text-xs font-bold border-2 transition-all ${bScore < 50 ? 'bg-gray-600 border-gray-600 text-white' : 'bg-white border-gray-200 text-gray-400 hover:border-gray-400'}`}>50점 미만</button>
                      </div>
                    </div>
                    <div className="mt-2 text-[11px] text-gray-500 leading-snug space-y-0.5">
                      <p><strong className="text-blue-500">몰입유지력</strong> · 딴짓 없이 학습에만 집중하는 힘</p>
                      <p><strong className="text-blue-500">공부끈기</strong> · 흔들림 없이 끝까지 완주하는 힘</p>
                      <p><strong className="text-blue-500">재시도근성</strong> · 실패 앞에서도 다시 일어서는 힘</p>
                    </div>
                  </div>

                  <div className={`p-3 rounded-xl border transition-colors ${cScore >= 50 ? 'bg-green-50/60 border-green-200' : 'bg-gray-50 border-gray-200'}`}>
                    <div className="flex items-center justify-between gap-2">
                      <label className="text-sm text-gray-700 font-bold shrink-0">인지 조절 (C)</label>
                      <div className="flex gap-1.5">
                        <button onClick={() => setCScore(75)} className={`px-3 py-1.5 rounded-lg text-xs font-bold border-2 transition-all ${cScore >= 50 ? 'bg-green-500 border-green-500 text-white' : 'bg-white border-gray-200 text-gray-400 hover:border-green-300'}`}>50점 이상</button>
                        <button onClick={() => setCScore(25)} className={`px-3 py-1.5 rounded-lg text-xs font-bold border-2 transition-all ${cScore < 50 ? 'bg-gray-600 border-gray-600 text-white' : 'bg-white border-gray-200 text-gray-400 hover:border-gray-400'}`}>50점 미만</button>
                      </div>
                    </div>
                    <div className="mt-2 text-[11px] text-gray-500 leading-snug space-y-0.5">
                      <p><strong className="text-green-600">생각속도</strong> · 또래보다 빠르게 반응하는 인지 민첩성</p>
                      <p><strong className="text-green-600">공부리듬</strong> · 문제마다 일정한 속도로 풀어가는 안정감</p>
                    </div>
                  </div>

                  <div className={`p-3 rounded-xl border transition-colors ${mScore >= 50 ? 'bg-red-50/60 border-red-200' : 'bg-gray-50 border-gray-200'}`}>
                    <div className="flex items-center justify-between gap-2">
                      <label className="text-sm text-gray-700 font-bold shrink-0">동기 조절 (M)</label>
                      <div className="flex gap-1.5">
                        <button onClick={() => setMScore(75)} className={`px-3 py-1.5 rounded-lg text-xs font-bold border-2 transition-all ${mScore >= 50 ? 'bg-red-500 border-red-500 text-white' : 'bg-white border-gray-200 text-gray-400 hover:border-red-300'}`}>50점 이상</button>
                        <button onClick={() => setMScore(25)} className={`px-3 py-1.5 rounded-lg text-xs font-bold border-2 transition-all ${mScore < 50 ? 'bg-gray-600 border-gray-600 text-white' : 'bg-white border-gray-200 text-gray-400 hover:border-gray-400'}`}>50점 미만</button>
                      </div>
                    </div>
                    <div className="mt-2 text-[11px] text-gray-500 leading-snug space-y-0.5">
                      <p><strong className="text-red-500">수정이력</strong> · 스스로 실수를 발견하고 정답으로 고치는 힘</p>
                      <p><strong className="text-red-500">학습독립성</strong> · 힌트 없이 내 힘으로 해결하는 힘</p>
                    </div>
                  </div>
                </div>
              </div>

              <div className="flex-1 flex flex-col justify-center">
                <div className="p-6 rounded-2xl border-2 transition-all duration-300 shadow-md h-full flex flex-col justify-center bg-indigo-50 border-indigo-200">
                  <div className="text-center mb-6">
                    <span className="inline-block px-3 py-1 bg-white rounded-full text-xs font-bold text-gray-500 shadow-sm mb-3 border border-indigo-100">
                      실시간 학습 기질 판독 결과
                    </span>
                    <h3 className="text-2xl font-black text-indigo-700 leading-tight">
                      {dominantType.split(' (')[0]}
                    </h3>
                    <p className="text-sm font-bold text-indigo-400 tracking-wide mb-4 mt-1">
                      {dominantType.includes('(') ? dominantType.split(' (')[1].replace(')', '') : ''}
                    </p>
                    <p className="text-gray-700 text-sm leading-relaxed text-left bg-white p-4 rounded-lg shadow-sm">
                      {typeDescription}
                    </p>
                  </div>

                  <div className="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
                    <h4 className="text-sm font-bold text-gray-800 mb-3 flex items-center">
                      <svg className="w-4 h-4 mr-2 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                      발견된 핵심 행동 패턴 (Trigger Events)
                    </h4>
                    <ul className="space-y-2">
                      {behaviorList.map((behavior, index) => (
                        <li key={index} className="flex items-start text-sm text-gray-600 leading-relaxed">
                          <span className="text-indigo-400 mr-2">▪</span>
                          <span className="flex-1 break-keep">{behavior}</span>
                        </li>
                      ))}
                    </ul>
                  </div>

                  <div className="bg-gradient-to-br from-violet-600 to-indigo-600 rounded-xl p-5 shadow-md mt-4">
                    <h4 className="text-sm font-bold text-white mb-3 flex items-center">
                      <svg className="w-4 h-4 mr-2 text-violet-200" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                      잉글리시팝 코칭 로드맵 (Coaching Roadmap)
                    </h4>
                    <ul className="space-y-3">
                      {roadmapList.map((roadmap, index) => (
                        <li key={index} className="flex items-start text-[13px] text-violet-50 leading-relaxed">
                          <span className="flex-shrink-0 w-5 h-5 rounded-full bg-white/20 text-white text-[10px] font-bold flex items-center justify-center mr-2.5 mt-0.5">{index + 1}</span>
                          <span className="flex-1 break-keep">{roadmap}</span>
                        </li>
                      ))}
                    </ul>
                  </div>
                </div>
              </div>
            </div>


          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<TemperamentSimulator />);
  </script>
</body>
</html>
